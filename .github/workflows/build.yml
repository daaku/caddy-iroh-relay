name: Go
on: [push]
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version: stable
        cache-dependency-path: go.mod
    - run: go build ./...
    - run: go vet ./...
    - run: go test ./...
